name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests without signing
        run: >-
          xcodebuild
          -project GGCustomizer.xcodeproj
          -scheme GGCustomizer
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest,arch=arm64'
          clean test
          CODE_SIGNING_ALLOWED=NO

      - name: Verify release simulator build without signing
        run: >-
          xcodebuild
          -project GGCustomizer.xcodeproj
          -scheme GGCustomizer
          -configuration Release
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest,arch=arm64'
          clean build
          CODE_SIGNING_ALLOWED=NO
