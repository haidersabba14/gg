name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run unit tests without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project GGCustomizer.xcodeproj \
            -scheme GGCustomizer \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest,arch=arm64' \
            clean test \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"

      - name: Verify release simulator build without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project GGCustomizer.xcodeproj \
            -scheme GGCustomizer \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest,arch=arm64' \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee "$RUNNER_TEMP/xcodebuild-release.log"

      - name: Report Xcode failure context
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/xcodebuild-test.log" "$RUNNER_TEMP/xcodebuild-release.log"; do
            [ -f "$log" ] || continue
            while IFS= read -r line; do
              safe_line="${line//'%'/'%25'}"
              safe_line="${safe_line//$'\r'/'%0D'}"
              safe_line="${safe_line//$'\n'/'%0A'}"
              echo "::error::$safe_line"
            done < <(grep -Ei 'error:|fatal error:|testing failed|\*\* (test|build) failed' "$log" | tail -n 20 || true)
          done
