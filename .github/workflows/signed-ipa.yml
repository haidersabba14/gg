name: Signed IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration to archive
        required: true
        default: Release
        type: choice
        options: [Release]

permissions:
  contents: read

jobs:
  archive:
    name: Archive signed IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$PROVISIONING_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$TEAM_ID"
          test -n "$EXPORT_OPTIONS_PLIST_BASE64"

      - name: Install temporary signing material
        id: signing
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/GGCustomizer.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          printf '%s' "$EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$EXPORT_OPTIONS_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "export_options_path=$EXPORT_OPTIONS_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive application
        run: >-
          xcodebuild
          -project GGCustomizer.xcodeproj
          -scheme GGCustomizer
          -configuration '${{ inputs.configuration }}'
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/GGCustomizer.xcarchive"
          DEVELOPMENT_TEAM="$TEAM_ID"
          archive

      - name: Export IPA
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/GGCustomizer.xcarchive"
          -exportOptionsPlist "${{ steps.signing.outputs.export_options_path }}"
          -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGCustomizer-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/GGCustomizer.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
