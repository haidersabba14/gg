name: Signed IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode configuration to archive
        required: true
        default: Release
        type: choice
        options: [Release]
      release_tag:
        description: Git tag/release to receive the IPA (leave empty to skip publishing)
        required: false
        default: v1.0.0
        type: string
      publish_release:
        description: Attach the successfully exported IPA to the selected GitHub Release
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark a newly created GitHub Release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  # Required only for the optional release step below. Signing material stays in
  # encrypted GitHub Secrets and is removed from the ephemeral runner at exit.
  contents: write

jobs:
  archive:
    name: Archive signed IPA
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      PROVISIONING_PROFILES_ZIP_BASE64: ${{ secrets.PROVISIONING_PROFILES_ZIP_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          missing=()
          for secret_name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD TEAM_ID EXPORT_OPTIONS_PLIST_BASE64; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ -z "$PROVISIONING_PROFILE_BASE64" ] && [ -z "$PROVISIONING_PROFILES_ZIP_BASE64" ]; then
            missing+=("PROVISIONING_PROFILE_BASE64 or PROVISIONING_PROFILES_ZIP_BASE64")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing signing secret name(s):" >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Install temporary signing material
        id: signing
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/GGCustomizer.mobileprovision"
          PROFILES_ARCHIVE_PATH="$RUNNER_TEMP/GGCustomizer-profiles.zip"
          PROFILES_DIRECTORY="$RUNNER_TEMP/GGCustomizer-profiles"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$EXPORT_OPTIONS_PATH"

          if [ -n "$PROVISIONING_PROFILES_ZIP_BASE64" ]; then
            mkdir -p "$PROFILES_DIRECTORY"
            printf '%s' "$PROVISIONING_PROFILES_ZIP_BASE64" | base64 --decode > "$PROFILES_ARCHIVE_PATH"
            ditto -x -k "$PROFILES_ARCHIVE_PATH" "$PROFILES_DIRECTORY"
            find "$PROFILES_DIRECTORY" -type f -name '*.mobileprovision' -exec cp {} "$HOME/Library/MobileDevice/Provisioning Profiles/" \;
            test -n "$(find "$PROFILES_DIRECTORY" -type f -name '*.mobileprovision' -print -quit)"
          else
            printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "export_options_path=$EXPORT_OPTIONS_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive application
        run: >-
          xcodebuild
          -project GGCustomizer.xcodeproj
          -scheme GGCustomizer
          -configuration '${{ inputs.configuration }}'
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/GGCustomizer.xcarchive"
          DEVELOPMENT_TEAM="$TEAM_ID"
          archive

      - name: Export IPA
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/GGCustomizer.xcarchive"
          -exportOptionsPlist "${{ steps.signing.outputs.export_options_path }}"
          -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GGCustomizer-signed-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed IPA to GitHub Release
        if: ${{ inputs.publish_release && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$IPA_PATH#GGCustomizer.ipa" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            PRE_RELEASE_FLAG=()
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              PRE_RELEASE_FLAG=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$IPA_PATH#GGCustomizer.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GG Customizer ${RELEASE_TAG#v}" \
              --generate-notes \
              "${PRE_RELEASE_FLAG[@]}"
          fi

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/GGCustomizer.mobileprovision" "$RUNNER_TEMP/GGCustomizer-profiles.zip" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/GGCustomizer-profiles"
